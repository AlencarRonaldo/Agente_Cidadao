version: '3.8'

services:
  # Load Balancer / Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: bot-denuncia-lb
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app-blue
      - app-green
    restart: unless-stopped
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Blue Environment (Primary)
  app-blue:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.production
    container_name: bot-denuncia-blue
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://admin:secret@postgres:5432/botdenuncia
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT_SLOT=blue
      - PORT=3000
      - HEALTH_CHECK_PORT=3001
    volumes:
      - ../uploads:/app/uploads:rw
      - ../logs:/app/logs:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Green Environment (Standby)
  app-green:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.production
    container_name: bot-denuncia-green
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://admin:secret@postgres:5432/botdenuncia
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT_SLOT=green
      - PORT=3000
      - HEALTH_CHECK_PORT=3001
    volumes:
      - ../uploads:/app/uploads:rw
      - ../logs:/app/logs:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PostgreSQL Database with replication
  postgres:
    image: postgres:15-alpine
    container_name: bot-denuncia-db
    environment:
      POSTGRES_DB: botdenuncia
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./postgres/init-replication.sql:/docker-entrypoint-initdb.d/init-replication.sql
      - ../logs/postgres:/var/log/postgresql
    restart: unless-stopped
    networks:
      - bot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d botdenuncia"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis with persistence
  redis:
    image: redis:7-alpine
    container_name: bot-denuncia-redis
    command: redis-server --appendonly yes --requirepass redispassword
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - ../logs/redis:/var/log/redis
    restart: unless-stopped
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: bot-denuncia-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - bot-network

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: bot-denuncia-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    networks:
      - bot-network

  # Log Aggregation - ELK Stack
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: bot-denuncia-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: unless-stopped
    networks:
      - bot-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: bot-denuncia-logstash
    volumes:
      - ./monitoring/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - ../logs:/logs:ro
    depends_on:
      - elasticsearch
    restart: unless-stopped
    networks:
      - bot-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: bot-denuncia-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    restart: unless-stopped
    networks:
      - bot-network

  # Health Check Service
  healthcheck:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.healthcheck
    container_name: bot-denuncia-healthcheck
    environment:
      - BLUE_URL=http://app-blue:3001/health
      - GREEN_URL=http://app-green:3001/health
      - CHECK_INTERVAL=30
    depends_on:
      - app-blue
      - app-green
    restart: unless-stopped
    networks:
      - bot-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  bot-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
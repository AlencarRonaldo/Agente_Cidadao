# Dynamic Upstream Configuration
# This file is managed by the deployment orchestrator

# Primary application upstream
upstream app_backend {
    # Default to blue environment (will be updated during deployments)
    server app-blue:3000 max_fails=3 fail_timeout=30s weight=100;
    server app-green:3000 max_fails=3 fail_timeout=30s weight=0 backup;
    
    # Connection pooling
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
    
    # Load balancing method
    least_conn;
}

# Admin panel upstream (can use different logic)
upstream admin_backend {
    server app-blue:3000 max_fails=2 fail_timeout=30s weight=100;
    server app-green:3000 max_fails=2 fail_timeout=30s weight=0 backup;
    
    keepalive 16;
    keepalive_requests 50;
    keepalive_timeout 60s;
}
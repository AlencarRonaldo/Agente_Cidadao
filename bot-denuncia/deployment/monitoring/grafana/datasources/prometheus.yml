apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    basicAuth: false
    jsonData:
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: 2.40.0
      cacheLevel: 'High'
      disableMetricsLookup: false
      incrementalQuerying: false
      incrementalQueryOverlapWindow: 10m
      
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "bot-denuncia-*"
    basicAuth: false
    isDefault: false
    jsonData:
      interval: Daily
      timeField: "@timestamp"
      esVersion: "8.11.0"
      includeFrozen: false
      logMessageField: message
      logLevelField: level
      
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    basicAuth: false
    isDefault: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: prometheus
          matcherRegex: "traceID=(\\w+)"
          name: TraceID
          url: "/explore?orgId=1&left=[\"now-1h\",\"now\",\"Jaeger\",{\"query\":\"${__value.raw}\"}]"
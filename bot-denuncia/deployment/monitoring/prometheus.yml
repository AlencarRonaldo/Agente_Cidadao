global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'bot-denuncia-monitor'
    environment: 'production'

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Application Health Checks
  - job_name: 'bot-denuncia-blue'
    static_configs:
      - targets: ['app-blue:3001']
    metrics_path: '/health'
    scrape_interval: 30s
    scrape_timeout: 10s
    params:
      detailed: ['true']

  - job_name: 'bot-denuncia-green'
    static_configs:
      - targets: ['app-green:3001']
    metrics_path: '/health'
    scrape_interval: 30s
    scrape_timeout: 10s
    params:
      detailed: ['true']

  # Health Monitor Service
  - job_name: 'health-monitor'
    static_configs:
      - targets: ['healthcheck:8080']
    metrics_path: '/status'
    scrape_interval: 30s

  # Database Monitoring
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 60s

  # Redis Monitoring  
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 60s

  # System Metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 60s

  # Load Balancer Monitoring
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    metrics_path: '/nginx_status'
    scrape_interval: 30s

  # Custom Application Metrics
  - job_name: 'bot-denuncia-metrics'
    static_configs:
      - targets: ['app-blue:3001', 'app-green:3001']
    metrics_path: '/health/metrics'
    scrape_interval: 60s

  # Business Metrics
  - job_name: 'business-metrics'
    static_configs:
      - targets: ['app-blue:3001', 'app-green:3001']
    metrics_path: '/api/admin/metrics'
    scrape_interval: 300s  # 5 minutes for business metrics

  # Performance Monitoring
  - job_name: 'performance-metrics'
    static_configs:
      - targets: ['app-blue:3001', 'app-green:3001']
    metrics_path: '/health/performance'
    scrape_interval: 120s  # 2 minutes
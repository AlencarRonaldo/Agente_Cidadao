input {
  file {
    path => "/logs/app.log"
    start_position => "beginning"
    type => "application"
    codec => "json"
    tags => ["application", "bot-denuncia"]
  }
  
  file {
    path => "/logs/error.log"
    start_position => "beginning"
    type => "error"
    codec => "json"
    tags => ["error", "bot-denuncia"]
  }
  
  file {
    path => "/logs/nginx/*.log"
    start_position => "beginning"
    type => "nginx"
    tags => ["nginx", "access"]
  }
  
  file {
    path => "/logs/postgres/*.log"
    start_position => "beginning"
    type => "postgres"
    tags => ["postgres", "database"]
  }
  
  file {
    path => "/logs/redis/*.log"
    start_position => "beginning"
    type => "redis"
    tags => ["redis", "cache"]
  }
}

filter {
  # Parse application logs
  if [type] == "application" {
    json {
      source => "message"
    }
    
    date {
      match => [ "timestamp", "ISO8601" ]
    }
    
    # Extract performance metrics
    if [responseTime] {
      mutate {
        convert => { "responseTime" => "integer" }
      }
    }
    
    # Categorize log levels
    if [level] == "error" or [level] == "fatal" {
      mutate {
        add_tag => ["alert"]
        add_field => { "severity" => "high" }
      }
    }
  }
  
  # Parse error logs
  if [type] == "error" {
    json {
      source => "message"
    }
    
    mutate {
      add_tag => ["error", "alert"]
      add_field => { "severity" => "critical" }
    }
    
    # Extract stack traces
    if [stack] {
      mutate {
        add_field => { "has_stack_trace" => "true" }
      }
    }
  }
  
  # Parse nginx logs
  if [type] == "nginx" {
    grok {
      match => { 
        "message" => "%{NGINXACCESS}"
      }
    }
    
    date {
      match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
    }
    
    mutate {
      convert => { 
        "response" => "integer"
        "bytes" => "integer"
        "response_time" => "float"
      }
    }
    
    # Flag error responses
    if [response] >= 400 {
      mutate {
        add_tag => ["error_response"]
      }
    }
    
    if [response] >= 500 {
      mutate {
        add_tag => ["server_error", "alert"]
        add_field => { "severity" => "high" }
      }
    }
  }
  
  # Parse postgres logs
  if [type] == "postgres" {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{NUMBER:pid}\] %{WORD:level}: %{GREEDYDATA:pg_message}"
      }
    }
    
    date {
      match => [ "timestamp", "yyyy-MM-dd HH:mm:ss.SSS" ]
    }
    
    # Flag slow queries
    if [pg_message] =~ /duration: \d{4,}/ {
      mutate {
        add_tag => ["slow_query", "performance"]
      }
    }
    
    # Flag connection issues
    if [pg_message] =~ /connection|authentication|timeout/ {
      mutate {
        add_tag => ["connection_issue", "alert"]
      }
    }
  }
  
  # Parse redis logs
  if [type] == "redis" {
    grok {
      match => { 
        "message" => "%{NUMBER:pid}:%{CHAR:role} %{TIMESTAMP_ISO8601:timestamp} %{CHAR:level} %{GREEDYDATA:redis_message}"
      }
    }
    
    date {
      match => [ "timestamp", "dd MMM yyyy HH:mm:ss.SSS" ]
    }
    
    # Flag memory warnings
    if [redis_message] =~ /memory|WARNING/ {
      mutate {
        add_tag => ["memory_warning", "performance"]
      }
    }
  }
  
  # Add environment information
  mutate {
    add_field => {
      "environment" => "${ENVIRONMENT_SLOT:unknown}"
      "service" => "bot-denuncia"
      "deployment_id" => "${DEPLOYMENT_ID:unknown}"
    }
  }
  
  # Remove unnecessary fields
  mutate {
    remove_field => [ "host", "path" ]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "bot-denuncia-%{+YYYY.MM.dd}"
  }
  
  # Send alerts to dead letter queue for processing
  if "alert" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "bot-denuncia-alerts-%{+YYYY.MM.dd}"
    }
  }
  
  # Debug output (remove in production)
  stdout {
    codec => rubydebug
  }
}
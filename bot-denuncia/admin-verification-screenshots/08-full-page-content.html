    <!-- Proteção robusta contra redefinição de propriedades de carteira -->
    <script>
      (function() {
        'use strict';
        
        // Intercepta tentativas de definir propriedades no window
        const originalDefineProperty = Object.defineProperty;
        
        Object.defineProperty = function(obj, prop, descriptor) {
          // Se tentar redefinir ethereum no window, ignora silenciosamente
          if (obj === window && prop === 'ethereum') {
            console.warn('🛡️ Bloqueada tentativa de redefinir window.ethereum');
            return obj; // Retorna sem fazer nada
          }
          
          // Para outras propriedades, usa o comportamento normal
          return originalDefineProperty.call(this, obj, prop, descriptor);
        };
        
        // Também intercepta erros globais
        window.addEventListener('error', function(event) {
          if (event.error && event.error.message && 
              (event.error.message.includes('redefine property: ethereum') ||
               event.error.message.includes('Cannot redefine property: ethereum'))) {
            console.warn('🛡️ Erro de ethereum interceptado e suprimido');
            event.preventDefault();
            event.stopPropagation();
            return false;
          }
        }, true);
        
        // Intercepta erros de promise
        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && event.reason.message && 
              event.reason.message.includes('ethereum')) {
            console.warn('🛡️ Promise rejection de ethereum suprimida');
            event.preventDefault();
          }
        });
        
        if (typeof console !== 'undefined' && window.location.hostname === 'localhost') {
          console.log('🛡️ Proteção anti-ethereum ativada');
        }
      })();
    </script>

/* Transições suaves para mudança de tema */

/* Transições globais para o body */
body {
  transition: background-color 0.3s ease, color 0.3s ease !important;
}

/* Transições para cards e papeis */
.MuiCard-root,
.MuiPaper-root {
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
}

/* Transições para elementos de texto */
.MuiTypography-root {
  transition: color 0.3s ease !important;
}

/* Transições para botões */
.MuiButton-root {
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
}

/* Transições para inputs */
.MuiTextField-root .MuiOutlinedInput-root {
  transition: all 0.3s ease !important;
}

.MuiTextField-root .MuiInputLabel-root {
  transition: color 0.3s ease !important;
}

/* Transições para chips */
.MuiChip-root {
  transition: all 0.2s ease !important;
}

/* Transições para AppBar */
.MuiAppBar-root {
  transition: all 0.3s ease !important;
}

/* Transições para Table */
.MuiTableCell-root {
  transition: all 0.3s ease !important;
}

.MuiTableHead-root .MuiTableCell-root {
  transition: background-color 0.3s ease !important;
}

/* Transições para Dialog */
.MuiDialog-paper {
  transition: all 0.3s ease !important;
}

/* Transições para IconButton */
.MuiIconButton-root {
  transition: all 0.2s ease !important;
}

/* Transições para Divider */
.MuiDivider-root {
  transition: border-color 0.3s ease !important;
}

/* Transições customizadas para o toggle do tema */
.theme-toggle-container {
  position: relative;
  overflow: hidden;
  border-radius: 8px;
}

.theme-toggle-icon {
  transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  transform-origin: center;
}

.theme-toggle-icon.rotating {
  transform: rotate(360deg);
}

/* Animações para hover effects */
@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes pulse {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.7;
  }
}

/* Efeitos de hover melhorados para cards */
.hover-card {
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
}

.hover-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
}

/* Transições para modo escuro específicas */
[data-theme="dark"] .MuiCard-root:hover {
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4) !important;
}

[data-theme="light"] .MuiCard-root:hover {
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15) !important;
}

/* Animações personalizadas para loading states */
.loading-shimmer {
  background: linear-gradient(90deg, 
    rgba(255, 255, 255, 0) 0%, 
    rgba(255, 255, 255, 0.2) 50%, 
    rgba(255, 255, 255, 0) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}

@keyframes shimmer {
  0% {
    background-position: -200% 0;
  }
  100% {
    background-position: 200% 0;
  }
}

/* Scrollbar personalizado para temas */
::-webkit-scrollbar {
  width: 8px;
}

::-webkit-scrollbar-track {
  background: var(--scrollbar-track);
  border-radius: 4px;
}

::-webkit-scrollbar-thumb {
  background: var(--scrollbar-thumb);
  border-radius: 4px;
  -webkit-transition: background 0.3s ease;
  transition: background 0.3s ease;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--scrollbar-thumb-hover);
}

/* Variáveis CSS para tema claro */
[data-theme="light"] {
  --scrollbar-track: #f1f5f9;
  --scrollbar-thumb: #cbd5e1;
  --scrollbar-thumb-hover: #94a3b8;
}

/* Variáveis CSS para tema escuro - Otimizado para contraste */
[data-theme="dark"] {
  --scrollbar-track: #475569;
  --scrollbar-thumb: #94a3b8;
  --scrollbar-thumb-hover: #cbd5e1;
  
  /* Cores de status com melhor contraste */
  --status-success: #4ade80;
  --status-error: #fb7185;
  --status-warning: #fbbf24;
  --status-info: #38bdf8;
  --status-pending: #a78bfa;
  
  /* Gradientes para elementos especiais */
  --gradient-primary: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
  --gradient-secondary: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
  --gradient-success: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
  --gradient-error: linear-gradient(135deg, #fb7185 0%, #f43f5e 100%);
  
  /* Backgrounds para componentes especiais */
  --card-elevated-bg: rgba(30, 41, 59, 0.8);
  --modal-backdrop: rgba(2, 6, 23, 0.75);
  --table-stripe-odd: rgba(255, 255, 255, 0.01);
  --table-stripe-even: rgba(255, 255, 255, 0.02);
  --table-hover: rgba(96, 165, 250, 0.08);
}

/* Melhorias para acessibilidade */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* Focus indicators melhorados */
.MuiButton-root:focus-visible,
.MuiIconButton-root:focus-visible,
.MuiTextField-root:focus-within {
  outline: 2px solid var(--focus-color);
  outline-offset: 2px;
}

[data-theme="light"] {
  --focus-color: #2563eb;
}

[data-theme="dark"] {
  --focus-color: #60a5fa;
}

/* Bordas mais visíveis em tema dark */

[data-theme="dark"] .MuiButton-containedSecondary {

  color: #0f172a !important;
}

[data-theme="dark"] .MuiDialog-paper {

/* Melhorias para elementos de navegação */

  }
  
  [data-theme="dark"] .MuiButton-root {
    border: 2px solid currentColor !important;
  }
